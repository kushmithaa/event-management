apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-management
  template:
    metadata:
      labels:
        app: event-management
    spec:
      containers:
        - name: event-management
          image: kushmithaa/event-management:1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-management-service
spec:
  type: NodePort
  selector:
    app: event-management
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30030